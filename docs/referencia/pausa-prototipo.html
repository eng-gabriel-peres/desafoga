<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pausa — protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F8; --surface:#FFFFFF; --surface2:#F5F7FB; --ink:#17202E; --muted:#4F5B70; --line:#D3DBE7;
  --primary:#2350C8; --primary-ink:#FFFFFF; --primary-soft:#E2E9FB;
  --good:#17804F; --good-soft:#DCF2E6; --bad:#B4380E; --bad-soft:#FBE4D9; --maybe:#735600; --maybe-soft:#FAEFCB;
  --e1:#4B5BD6; --e2:#6F9BE3; --e3:#98A2B3; --e4:#EFB23A; --e5:#EC8A1C;
  --chat-bg:#E4ECE3; --chat-me:#D4F1C6; --chat-bot:#FFFFFF;
  --scrim:rgba(14,20,30,.5);
  --fs:18px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141E; --surface:#172030; --surface2:#1C2738; --ink:#EEF2F8; --muted:#A9B3C4; --line:#2B374B;
    --primary:#86A6FF; --primary-ink:#0E141E; --primary-soft:#22345C;
    --good:#5FD39A; --good-soft:#163A2A; --bad:#FF9A70; --bad-soft:#43261B; --maybe:#F2CF6B; --maybe-soft:#3D3416;
    --e1:#7E8BFF; --e2:#86B1F2; --e3:#A3ACBB; --e4:#F4C25A; --e5:#F59E3D;
    --chat-bg:#111A22; --chat-me:#1E4A37; --chat-bot:#1E2A39;
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141E; --surface:#172030; --surface2:#1C2738; --ink:#EEF2F8; --muted:#A9B3C4; --line:#2B374B;
  --primary:#86A6FF; --primary-ink:#0E141E; --primary-soft:#22345C;
  --good:#5FD39A; --good-soft:#163A2A; --bad:#FF9A70; --bad-soft:#43261B; --maybe:#F2CF6B; --maybe-soft:#3D3416;
  --e1:#7E8BFF; --e2:#86B1F2; --e3:#A3ACBB; --e4:#F4C25A; --e5:#F59E3D;
  --chat-bg:#111A22; --chat-me:#1E4A37; --chat-bot:#1E2A39;
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
html{font-size:var(--fs);scroll-padding-top:env(safe-area-inset-top,0px);}
html.big{--fs:21px;}
html.desk{--fs:16px;}
html.desk.big{--fs:19px;}
html.zoomed body{overflow-x:hidden;}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45;-webkit-text-size-adjust:100%;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);}
button,input,select{font:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;}
h1,h2,h3{margin:0;line-height:1.2;}
p{margin:0;}

/* ---------- celular: topo e menu ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);}
.top-in{max-width:620px;margin:0 auto;padding:10px 12px;display:flex;align-items:center;gap:8px;}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.2rem;margin-right:auto;}
.mark{width:30px;height:30px;border-radius:50%;background:var(--primary);position:relative;flex:none;}
.mark::before,.mark::after{content:"";position:absolute;top:8px;width:4px;height:14px;border-radius:2px;background:var(--primary-ink);}
.mark::before{left:10px;} .mark::after{right:10px;}
.roles{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;}
.roles button{flex:1;border:0;background:none;padding:7px 10px;border-radius:9px;font-size:.85rem;font-weight:700;color:var(--muted);min-height:38px;}
.roles button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line);}
.iconbtn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;min-width:42px;min-height:42px;font-weight:700;display:inline-grid;place-items:center;position:relative;}
.iconbtn[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);}
.dot{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font-size:.7rem;display:grid;place-items:center;padding:0 5px;}
main{max-width:620px;margin:0 auto;padding:18px 16px 120px;}
main.flowing{padding-bottom:40px;}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);}
.nav-in{max-width:620px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:66px;font-size:.78rem;color:var(--muted);position:relative;}
.nav .ic{font-size:1.4rem;line-height:1;}
.nav button[aria-current="page"]{color:var(--primary);font-weight:700;}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--primary);}

/* ---------- desktop: barra lateral ---------- */
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:var(--vh,100vh);}
.side{position:sticky;top:0;height:var(--vh,100vh);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;padding:20px 14px;overflow:auto;}
.side .brand{padding:2px 8px;margin:0;font-size:1.3rem;}
.side-label{font-size:.8rem;color:var(--muted);padding:0 8px;margin-bottom:6px;}
.side-nav{display:grid;gap:4px;}
.side-nav button{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 12px;border-radius:12px;border:0;background:none;font-weight:700;color:var(--muted);text-align:left;}
.side-nav button:hover{background:var(--surface2);color:var(--ink);}
.side-nav button[aria-current="page"]{background:var(--primary-soft);color:var(--primary);}
.side-nav .ic{font-size:1.2rem;width:24px;text-align:center;}
.side-nav .count{margin-left:auto;background:var(--bad);color:#fff;border-radius:10px;font-size:.72rem;padding:1px 7px;}
.side-foot{margin-top:auto;display:grid;gap:10px;}
.side-btn{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-weight:700;font-size:.9rem;}
.side-btn[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);}
.usercard{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);}
.usercard b{display:block;font-size:.95rem;}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--c);flex:none;font-size:.95rem;}
.av.sm{width:32px;height:32px;font-size:.8rem;}
.av.lg{width:52px;height:52px;font-size:1.15rem;}
.dmain{min-width:0;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:15;background:var(--bg);display:flex;align-items:center;gap:14px;padding:20px 36px 16px;border-bottom:1px solid var(--line);}
.topbar h1{font-size:1.55rem;}
.topbar .sub{margin-top:2px;}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px;}
.dcontent{padding:28px 36px 56px;width:100%;max-width:1280px;}
.pselect{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 10px 6px 6px;}
.pselect select{border:0;background:none;font-weight:700;font-size:.95rem;min-height:36px;cursor:pointer;}
.bell-pop{position:absolute;right:0;top:52px;width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 16px;z-index:40;box-shadow:0 12px 32px rgba(0,0,0,.18);text-align:left;font-weight:400;}
.bell-wrap{position:relative;}

/* ---------- blocos comuns ---------- */
.hello{font-size:1.7rem;font-weight:700;}
.date{color:var(--muted);margin-top:2px;}
.stack>*+*{margin-top:16px;}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;}
.panel h2{font-size:1.12rem;margin-bottom:10px;}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;}
.panel-head h2{margin:0;}
.sub{color:var(--muted);font-size:.92rem;}
.sec-title{font-size:1.15rem;font-weight:700;margin:26px 0 8px;}
.grid2,.grid2e,.grid3{display:grid;gap:16px;align-items:start;}
.grid2>*,.grid2e>*,.grid3>*{min-width:0;}
.desk .grid2{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;}
.desk .grid2e{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;}
.desk .grid3{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));}
.desk .kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;}
.kpi span{display:block;color:var(--muted);font-size:.85rem;}
.kpi b{display:block;font-size:1.45rem;margin-top:4px;}
.kpi small{color:var(--muted);font-size:.8rem;}
.desk-only{display:none;}
.desk .desk-only{display:block;}
.desk .mob-only{display:none;}

/* nota do dia */
.score{border-radius:24px;padding:20px;background:var(--surface);border:2px solid color-mix(in srgb,var(--c) 55%,var(--line));}
.score-top{display:flex;align-items:center;gap:16px;}
.score-face{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:2.8rem;flex:none;background:color-mix(in srgb,var(--c) 28%,var(--surface));border:3px solid var(--c);}
.desk .score-face{width:104px;height:104px;font-size:3.4rem;}
.score-kicker{font-weight:700;color:var(--muted);}
.score-num{font-size:3.2rem;font-weight:700;line-height:1;letter-spacing:-.02em;}
.desk .score-num{font-size:4rem;}
.score-num small{font-size:1.1rem;color:var(--muted);font-weight:400;letter-spacing:0;margin-left:4px;}
.score-label{font-size:1.15rem;font-weight:700;margin-top:4px;}
.scale{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:20px;}
.scale span{height:12px;border-radius:6px;}
.pin{position:absolute;top:-7px;width:26px;height:26px;border-radius:50%;background:var(--surface);border:4px solid var(--ink);transform:translateX(-50%);}
.scale-ends{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-top:6px;}
.score-note{margin-top:12px;color:var(--muted);font-size:.92rem;}
.score.empty{--c:var(--e3);}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 20px;border-radius:14px;border:2px solid transparent;font-weight:700;font-size:1.05rem;text-decoration:none;}
.desk .btn{min-height:48px;font-size:1rem;}
.btn-primary{background:var(--primary);color:var(--primary-ink);}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink);}
.btn-block{width:100%;}
.btn-xl{min-height:68px;font-size:1.2rem;border-radius:18px;}
.desk .btn-xl{min-height:60px;font-size:1.1rem;}
.btn-small{min-height:44px;font-size:.92rem;padding:0 14px;border-radius:11px;}
.desk .btn-small{min-height:40px;}
.btn-link{background:none;border:0;color:var(--primary);font-weight:700;padding:8px 0;min-height:44px;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.row>.btn{flex:1 1 160px;}

/* compras */
.buy{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
.buy:last-child{border-bottom:0;}
.face{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;background:color-mix(in srgb,var(--c) 28%,var(--surface));border:2px solid var(--c);flex:none;}
.face.sm{width:34px;height:34px;font-size:1.1rem;}
.buy-name{font-weight:700;}
.buy-meta{color:var(--muted);font-size:.85rem;}
.buy-val{font-weight:700;text-align:right;}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:700;margin-top:4px;white-space:nowrap;}
.tag-sim{background:var(--good-soft);color:var(--good);}
.tag-nao{background:var(--bad-soft);color:var(--bad);}
.tag-talvez{background:var(--maybe-soft);color:var(--maybe);}
.tag-neutral{background:var(--surface2);color:var(--muted);border:1px solid var(--line);}
.empty-box{border:2px dashed var(--line);border-radius:18px;padding:20px;color:var(--muted);text-align:center;}

/* fluxo de registro */
.steps{display:flex;gap:6px;margin:4px 0 18px;}
.steps span{flex:1;height:6px;border-radius:3px;background:var(--line);}
.steps span.on{background:var(--primary);}
.flow-q{font-size:1.6rem;font-weight:700;margin-bottom:6px;}
.field{display:block;margin-top:16px;}
.field>span{display:block;font-weight:700;margin-bottom:6px;}
.input{width:100%;min-height:58px;padding:0 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:1.15rem;}
.desk .input{min-height:50px;font-size:1.05rem;}
.input:focus{border-color:var(--primary);outline:none;}
.money{display:flex;align-items:center;border:2px solid var(--line);border-radius:16px;background:var(--surface);padding:0 16px;}
.money:focus-within{border-color:var(--primary);}
.money b{font-size:1.6rem;color:var(--muted);}
.money input{border:0;background:none;outline:none;width:100%;min-height:76px;font-size:2.2rem;font-weight:700;padding-left:10px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{min-height:46px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:.95rem;}
.desk .chip{min-height:40px;}
.chip[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);}
.opts{display:grid;gap:10px;margin-top:16px;}
.opt{display:flex;align-items:center;gap:14px;min-height:72px;padding:0 16px;border-radius:18px;border:2px solid var(--line);background:var(--surface);font-size:1.15rem;font-weight:700;text-align:left;}
.desk .opt{min-height:62px;}
.opt .face{width:52px;height:52px;font-size:1.8rem;}
.opt:hover{border-color:var(--primary);}
.opt .big-ic{font-size:1.8rem;width:52px;text-align:center;}
.err{color:var(--bad);font-weight:700;margin-top:8px;}
.done-ic{width:96px;height:96px;border-radius:50%;margin:10px auto 14px;display:grid;place-items:center;background:var(--good-soft);color:var(--good);font-size:3rem;}
.modal-back{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:50;padding:24px;}
.modal{background:var(--bg);border-radius:24px;width:min(600px,100%);max-height:calc(var(--vh,100vh) - 48px);overflow:auto;padding:24px 32px 32px;border:1px solid var(--line);}

/* semana */
.legend{color:var(--muted);font-size:.9rem;margin-bottom:12px;}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
.wcol{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;}
.wface{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:1.25rem;background:color-mix(in srgb,var(--c) 28%,var(--surface));border:2px solid var(--c);}
.desk .wface{width:46px;height:46px;font-size:1.5rem;}
.wface.none{--c:var(--line);border-style:dashed;color:var(--muted);}
.wscore{font-weight:700;font-size:.9rem;}
.wbar-wrap{height:84px;width:100%;display:flex;align-items:flex-end;justify-content:center;margin-top:4px;}
.desk .wbar-wrap{height:150px;}
.wbar{width:62%;max-width:46px;min-height:3px;border-radius:6px 6px 2px 2px;background:var(--primary);}
.wval{font-size:.72rem;color:var(--muted);white-space:nowrap;}
.desk .wval{font-size:.82rem;}
.wday{font-size:.85rem;font-weight:700;}
.wday.today{color:var(--primary);}
.insight{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);}
.insight:last-child{border-bottom:0;}
.insight .ic{font-size:1.4rem;line-height:1.3;}
.split{display:flex;height:22px;border-radius:11px;overflow:hidden;margin:10px 0;}
.split .s1{background:var(--good);} .split .s2{background:var(--bad);} .split .s3{background:var(--maybe);}
.keys{display:grid;gap:6px;}
.key{display:flex;align-items:center;gap:8px;}
.key i{width:14px;height:14px;border-radius:4px;display:inline-block;}
.key b{margin-left:auto;}
.hours{display:grid;gap:10px;}
.hour{display:grid;grid-template-columns:96px 34px 1fr auto;gap:10px;align-items:center;}
.hour-bar{height:12px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;}
.hour-bar i{display:block;height:100%;background:var(--bad);}

/* conquistas */
.ach{display:grid;grid-template-columns:56px 1fr;gap:14px;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);}
.achs{display:grid;gap:12px;}
.desk .achs.wide{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));}
.ach-ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:1.9rem;background:var(--surface2);border:1px solid var(--line);}
.ach.done{border:2px solid var(--good);}
.ach.done .ach-ic{background:var(--good-soft);border-color:var(--good);}
.ach-title{font-weight:700;font-size:1.05rem;}
.bar{height:12px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;margin:10px 0 4px;}
.bar i{display:block;height:100%;background:var(--primary);border-radius:6px;}
.ach.done .bar i{background:var(--good);}
.prize{margin-top:6px;font-size:.92rem;}
.ach-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:.88rem;}

/* chat */
.chat-wrap{max-width:440px;}
.desk .chat-wrap{border:1px solid var(--line);border-radius:28px;padding:10px;background:var(--surface);}
.chat-head{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;border-bottom:0;}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--primary);display:grid;place-items:center;position:relative;flex:none;}
.avatar::before,.avatar::after{content:"";position:absolute;top:12px;width:4px;height:18px;border-radius:2px;background:var(--primary-ink);}
.avatar::before{left:14px;} .avatar::after{right:14px;}
.chat{background:var(--chat-bg);border:1px solid var(--line);border-top:0;border-radius:0 0 18px 18px;padding:14px 10px;display:flex;flex-direction:column;gap:8px;min-height:40vh;}
.desk .chat{height:560px;min-height:0;overflow:auto;}
.msg{max-width:86%;padding:8px 12px 6px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word;font-size:.98rem;}
.msg.bot{background:var(--chat-bot);align-self:flex-start;border-top-left-radius:4px;}
.msg.me{background:var(--chat-me);align-self:flex-end;border-top-right-radius:4px;}
.msg time{display:block;text-align:right;font-size:.7rem;color:var(--muted);margin-top:2px;}
.quick{display:flex;flex-wrap:wrap;gap:6px;align-self:flex-start;max-width:96%;}
.quick button{min-height:44px;padding:0 14px;border-radius:999px;border:2px solid var(--primary);background:var(--surface);color:var(--primary);font-weight:700;}
.composer{display:flex;gap:8px;margin-top:12px;}
.composer .input{flex:1;border-radius:999px;min-height:54px;}
.send{min-width:54px;min-height:54px;border-radius:50%;border:0;background:var(--primary);color:var(--primary-ink);font-size:1.3rem;}
.hint{background:var(--primary-soft);border-radius:14px;padding:12px 14px;font-size:.95rem;margin-bottom:12px;}
.sims{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.sims .btn{flex:1 1 200px;}
.cmds{display:grid;gap:10px;}
.cmd{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;}
.sim-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
.desk .sim-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
.sim-grid .btn{width:100%;justify-content:flex-start;}
.cmd code{font-family:inherit;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-weight:700;white-space:nowrap;}
.preview-bubble{background:var(--chat-bg);border-radius:16px;padding:14px;}
.preview-bubble .msg{max-width:100%;}

/* responsável */
.lines>div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
.lines>div:last-child{border-bottom:0;}
.lines b{font-size:1.25rem;}
.alert{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
.alert:last-child{border-bottom:0;}
.alert time{display:block;color:var(--muted);font-size:.8rem;}
.day-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:24px 0 8px;}
.day-h h3{font-size:1.1rem;}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;}
.pcard+.pcard{margin-top:10px;}
.pcard .buy{border:0;padding:0;}
.eval{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.eval button,.seg button{min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:.92rem;}
.eval button[aria-pressed="true"].y,.seg button[aria-pressed="true"].y{border-color:var(--good);background:var(--good-soft);color:var(--good);}
.eval button[aria-pressed="true"].n,.seg button[aria-pressed="true"].n{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);}
.seg{display:flex;gap:6px;}
.seg button{min-height:36px;font-size:.85rem;padding:0 12px;border-radius:10px;white-space:nowrap;}
.said{margin-top:10px;font-size:.92rem;}
.diff{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--maybe-soft);color:var(--maybe);font-size:.9rem;font-weight:700;}
.diff-ic{color:var(--maybe);font-weight:700;font-size:.8rem;display:block;margin-top:4px;}
.types{display:grid;gap:8px;}
.type{display:flex;gap:12px;align-items:center;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;min-height:56px;font-weight:700;}
.desk .type{min-height:48px;}
.type[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);}
.emo-pick{display:flex;gap:8px;flex-wrap:wrap;}
.emo-pick button{width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:1.6rem;}
.emo-pick button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);}
.set{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line);}
.set:last-child{border-bottom:0;}
.set-txt{flex:1;}
.set-txt b{display:block;}
.set-extra{margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.set-extra .input{width:140px;min-height:48px;font-size:1rem;}
.sw{position:relative;width:60px;height:36px;flex:none;}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;}
.sw span{position:absolute;inset:0;border-radius:18px;background:var(--line);transition:background .15s;}
.sw span::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:var(--surface);transition:transform .15s;}
.sw input:checked+span{background:var(--good);}
.sw input:checked+span::after{transform:translateX(24px);}
.sw input:focus-visible+span{outline:3px solid var(--primary);outline-offset:2px;}
.conn{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--good-soft);color:var(--good);font-weight:700;}
.pbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:10px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);}
.pbar select{margin-left:auto;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:0 10px;font-weight:700;}
.status{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:700;white-space:nowrap;}
.status.att{background:var(--bad-soft);color:var(--bad);}
.status.ok{background:var(--good-soft);color:var(--good);}
.status.mid{background:var(--maybe-soft);color:var(--maybe);}
.plist{display:grid;gap:10px;}
.prow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%;}
.prow:hover{border-color:var(--primary);}

/* tabela */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;}
table.dt{width:100%;border-collapse:collapse;min-width:760px;}
.dt th{text-align:left;font-size:.82rem;color:var(--muted);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap;}
.dt td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;}
.dt tr:last-child td{border-bottom:0;}
.dt tr.click{cursor:pointer;}
.dt tr.click:hover td{background:var(--surface2);}
.dt .num{text-align:right;white-space:nowrap;}
.cell-p{display:flex;align-items:center;gap:10px;}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:14px;font-weight:700;z-index:60;max-width:90vw;text-align:center;}
.desk .toast{bottom:28px;}
.demo-note{font-size:.78rem;color:var(--muted);padding:0 8px;}
.evgrid{display:grid;gap:14px;}
.desk .evgrid{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px;}
.evcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;color:var(--ink);}
button.evcard:hover{border-color:var(--primary);}
.ev-top{display:flex;gap:12px;align-items:flex-start;}
.ev-ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:1.45rem;border:1px solid var(--line);flex:none;}
.ev-ic.ch{background:var(--primary-soft);border-color:var(--primary);}
.ev-ic.pr{background:var(--maybe-soft);border-color:var(--maybe);}
.ev-title{font-weight:700;font-size:1.08rem;}
.ev-meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:.9rem;margin-top:10px;}
.ev-people{display:flex;align-items:center;gap:10px;margin-top:12px;}
.avstack{display:flex;}
.avstack .av{border:2px solid var(--surface);margin-left:-8px;}
.avstack .av:first-child{margin-left:0;}
.status.live,.status.new{background:var(--good-soft);color:var(--good);}
.status.soon{background:var(--primary-soft);color:var(--primary);}
.status.end{background:var(--surface2);color:var(--muted);border:1px solid var(--line);}
.status.new{background:var(--primary-soft);color:var(--primary);}
.dots{display:flex;gap:5px;flex-wrap:wrap;}
.dd{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:700;border:2px solid var(--line);color:var(--muted);background:var(--surface);}
.dd.ok{background:var(--good-soft);border-color:var(--good);color:var(--good);}
.dd.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);}
.dd.fut{border-style:dashed;}
.dd.today{outline:2px solid var(--ink);outline-offset:2px;}
.prow2{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
.prow2 .dots{grid-column:1/-1;grid-row:2;}
.desk .prow2{grid-template-columns:150px minmax(0,1fr) auto auto;}
.desk .prow2 .dots{grid-column:auto;grid-row:auto;}
.desk .prow2.pres{grid-template-columns:minmax(0,1fr) auto auto;}
.prow2:last-of-type{border-bottom:0;}
.rm{min-height:36px;padding:0 6px;color:var(--muted);}
.linkbox{display:flex;gap:8px;flex-wrap:wrap;}
.linkbox .input{flex:1 1 220px;min-height:46px;font-size:.88rem;}
.kindopts{display:grid;gap:10px;}
.desk .kindopts{grid-template-columns:1fr 1fr;}
.kindopt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);}
.kindopt[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);}
.checks{display:grid;gap:8px;}
.check{display:flex;align-items:center;gap:10px;min-height:50px;padding:6px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;}
.check input{width:22px;height:22px;flex:none;accent-color:var(--primary);}
textarea.input{min-height:96px;padding:12px 14px;resize:vertical;font-family:inherit;line-height:1.45;}
.two{display:grid;gap:12px;grid-template-columns:1fr 1fr;}
.rsvp{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.rsvp button{flex:1 1 90px;min-height:50px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;}
.rsvp button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);}
.okline{margin-top:12px;color:var(--good);font-weight:700;}
.join{max-width:560px;margin:0 auto;padding:24px 16px 56px;}
.nav-in.six button{font-size:.68rem;}
.i{width:1.15em;height:1.15em;flex:none;vertical-align:-0.2em;}
.btn .i,.chip .i,.pbtn .i,.rtabs .i,.rsvp .i,.side-btn .i,.seg .i,.btn-link .i,.ptag .i{margin-right:6px;}
.btn-link{display:inline-flex;align-items:center;}
.chip{display:inline-flex;align-items:center;}
.nav .ic .i{width:24px;height:24px;}
.side-nav .ic .i{width:20px;height:20px;}
.iconbtn .i{width:20px;height:20px;}
.face svg,.score-face svg,.wface svg{width:100%;height:100%;color:var(--ink);}
.face.xs{width:28px;height:28px;}
.ev-ic .i{width:24px;height:24px;}
.ev-ic.ch{color:var(--primary);} .ev-ic.pr{color:var(--maybe);}
.ach-ic .i{width:28px;height:28px;color:var(--primary);}
.ach.done .ach-ic .i{color:var(--good);}
.emo-pick button .i{width:24px;height:24px;}
.big-ic .i{width:30px;height:30px;}
.opt .big-ic{display:grid;place-items:center;}
.opt .big-ic.y{color:var(--good);} .opt .big-ic.n{color:var(--bad);} .opt .big-ic.m{color:var(--maybe);}
.done-ic .i{width:48px;height:48px;}
.ev-meta span,.side-lines>div{display:inline-flex;align-items:center;gap:6px;}
.dd .i{width:14px;height:14px;}
.dd.mini{width:20px;height:20px;font-size:.62rem;display:inline-grid;vertical-align:middle;margin:0 4px 0 10px;}
.dd.mini:first-child{margin-left:0;}
.dd.mini .i{width:11px;height:11px;}
.dots.big .dd{width:38px;height:38px;font-size:.9rem;}
.dots.big .dd .i{width:18px;height:18px;}
.okline{display:flex;align-items:center;gap:6px;}
.send .i{width:22px;height:22px;}
.insight .ic{display:grid;place-items:center;width:28px;color:var(--muted);}
.insight .ic .i{width:22px;height:22px;}
.alert>.aic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);flex:none;color:var(--muted);}
.alert>.aic .i{width:18px;height:18px;}
.cat-ic{color:var(--muted);}
.rtabs{display:flex;gap:6px;margin-top:16px;overflow-x:auto;padding-bottom:2px;}
html:not(.desk) .rtabs button{flex:1 1 auto;justify-content:center;padding:0 10px;font-size:.9rem;}
html:not(.desk) .ev-top{display:grid;grid-template-columns:48px minmax(0,1fr);}
html:not(.desk) .ev-top>.status{grid-column:2;justify-self:start;}
.rtabs button{display:inline-flex;align-items:center;white-space:nowrap;min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;color:var(--muted);}
.rtabs button[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink);}
.composer-card textarea{margin-top:12px;min-height:84px;}
.composer-card .post-head b{font-size:1rem;}
.composer-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;}
.composer-foot .chip{min-height:38px;font-size:.85rem;padding:0 12px;}
.feed{display:grid;gap:12px;margin-top:16px;}
.post{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;}
.post.pinned{border:2px solid var(--primary);}
.pin-label{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;color:var(--primary);margin-bottom:10px;}
.pin-label .i{width:14px;height:14px;}
.post-head{display:flex;align-items:center;gap:10px;}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--primary-soft);color:var(--primary);vertical-align:1px;}
.ptag{display:inline-flex;align-items:center;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);white-space:nowrap;}
.ptag .i{width:14px;height:14px;margin-right:4px;}
.ptag.dica{background:var(--maybe-soft);color:var(--maybe);border-color:transparent;}
.ptag.conquista{background:var(--good-soft);color:var(--good);border-color:transparent;}
.ptag.desabafo{background:var(--primary-soft);color:var(--primary);border-color:transparent;}
.ptag.aviso{background:var(--ink);color:var(--surface);border-color:transparent;}
.post-text{margin-top:12px;white-space:pre-wrap;}
.post-foot{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
.pbtn{display:inline-flex;align-items:center;min-height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.85rem;color:var(--muted);}
.pbtn.on{color:var(--bad);border-color:var(--bad);background:var(--bad-soft);}
.pbtn.on .i{fill:currentColor;}
.pbtn span{margin-left:4px;}
.post.sys{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface2);color:var(--muted);font-size:.9rem;}
.post.sys time{margin-left:auto;font-size:.78rem;white-space:nowrap;}
.post.sys .i{color:var(--maybe);}
.podiums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end;margin:6px 0 16px;}
.podium{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;border-radius:16px;background:var(--surface2);border:1px solid var(--line);text-align:center;}
.podium.p1{order:2;padding-top:22px;border:2px solid var(--e4);background:color-mix(in srgb,var(--e4) 14%,var(--surface));}
.podium.p2{order:1;} .podium.p3{order:3;}
.podium.me b{color:var(--primary);}
.podium .medal .i{width:26px;height:26px;color:var(--e4);}
.podium.p2 .medal .i{color:var(--e3);} .podium.p3 .medal .i{color:#B87333;}
.podium .pts{font-weight:700;font-size:1.1rem;}
.rank-list{display:grid;}
.rank-row{display:flex;align-items:center;gap:12px;padding:12px 8px;border-top:1px solid var(--line);}
.rank-row.me{background:var(--primary-soft);border-radius:12px;border-top-color:transparent;}
.rank-pos{width:30px;font-weight:700;font-size:1.05rem;text-align:center;}
.streak{display:inline-flex;align-items:center;gap:3px;font-weight:700;color:var(--e5);}
.streak .i{width:16px;height:16px;}
.rank-pts{font-weight:700;font-size:1.15rem;min-width:62px;text-align:right;}
.rank-pts small{font-size:.75rem;color:var(--muted);font-weight:400;}
.rules-list{display:grid;gap:10px;}
.rules-list>div{display:flex;gap:10px;align-items:flex-start;}
.rules-list .i{margin-top:3px;color:var(--primary);}
.side-card .big-stat{display:flex;flex-direction:column;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line);}
.side-card .big-stat b{font-size:2rem;line-height:1.1;}
.side-card .big-stat small{font-size:1rem;color:var(--muted);font-weight:400;}
.side-lines{display:grid;gap:8px;}
.side-lines .i{color:var(--muted);}
.pill{display:inline-block;margin-left:8px;font-size:.75rem;padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.22);}
.danger{color:var(--bad);border-color:var(--bad);}
.rsvp button{display:inline-flex;align-items:center;justify-content:center;}
.feed-layout{display:grid;grid-template-columns:minmax(0,540px) 340px;gap:32px;justify-content:center;align-items:start;}
.feed-side{position:sticky;top:104px;}
.stories{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 8px;}
.story{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;font-size:.8rem;font-weight:700;color:var(--ink);flex:none;width:72px;}
.story-ring{padding:3px;border-radius:50%;background:var(--line);}
.story-ring.new{background:linear-gradient(45deg,var(--e4),var(--e5),#BE185D);}
.story-ring.add{background:var(--primary-soft);}
.story-ring .av{width:58px;height:58px;border:3px solid var(--bg);font-size:1.1rem;}
.plus-av{--c:var(--surface);color:var(--primary);}
.plus-av .i{width:26px;height:26px;}
.filters.topics{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;}
.chip.sm{min-height:36px;font-size:.82rem;padding:0 12px;white-space:nowrap;}
.fposts{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:6px;}
.feedcol{min-width:0;}
.fpost{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 14px 16px;}
.fp-head{display:flex;align-items:center;gap:10px;}
.fp-who{flex:1;min-width:0;}
.av-btn{border:0;background:none;padding:0;border-radius:50%;}
.link-name{background:none;border:0;padding:0;font-weight:700;color:var(--ink);cursor:pointer;font-size:inherit;text-align:left;}
.verified .i{width:16px;height:16px;color:var(--primary);vertical-align:-3px;margin-left:4px;}
.iconbtn.sm{min-width:36px;min-height:36px;border-radius:10px;}
.iconbtn.sm .i{width:16px;height:16px;}
.media{position:relative;border-radius:16px;color:#fff;overflow:hidden;margin-top:12px;user-select:none;}
.media.sq{aspect-ratio:1/1;}
.media.wide{aspect-ratio:16/9;}
.media-in{position:absolute;inset:0;padding:28px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;}
.media-quote{font-size:1.45rem;font-weight:700;line-height:1.3;}
.desk .media-quote{font-size:1.6rem;}
.media-title{font-size:1.9rem;font-weight:700;line-height:1.15;}
.desk .media-title{font-size:2.2rem;}
.media-kicker{display:inline-flex;gap:6px;align-items:center;font-size:.85rem;font-weight:700;opacity:.92;}
.media-kicker.dark{color:var(--muted);opacity:1;}
.media-sign{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;opacity:.85;}
.media-num{font-size:3.4rem;font-weight:700;opacity:.35;line-height:1;}
.media-count{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.35);padding:2px 10px;border-radius:999px;font-size:.8rem;z-index:2;}
.car-btn{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.94);color:#17202E;display:grid;place-items:center;z-index:2;}
.car-btn.prev{left:10px;} .car-btn.next{right:10px;}
.car-dots{display:flex;justify-content:center;gap:5px;margin-top:10px;}
.car-dots span{width:7px;height:7px;border-radius:50%;background:var(--line);}
.car-dots .on{background:var(--primary);}
.fp-actions{display:flex;gap:4px;margin-top:8px;}
.fa{width:44px;height:44px;border:0;background:none;border-radius:12px;display:grid;place-items:center;color:var(--ink);}
.fa .i{width:26px;height:26px;}
.fa:hover{background:var(--surface2);}
.fa.right{margin-left:auto;}
.fa.on{color:var(--bad);} .fa.on .i{fill:currentColor;}
.fa.on.save{color:var(--ink);}
.likes{font-weight:700;margin-top:2px;}
.cap{margin-top:6px;}
.muted-cap{color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.btn-link.muted{color:var(--muted);min-height:36px;padding:4px 0;font-weight:400;}
.btn-link .i{margin-left:4px;}
.poll{margin-top:12px;border-radius:16px;padding:20px;background:var(--surface2);border:1px solid var(--line);}
.poll-q{font-size:1.25rem;font-weight:700;margin:8px 0 14px;}

.cmt{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.cmt-body{flex:1;min-width:0;}
.btn-link.mini{min-height:auto;padding:0 0 0 8px;font-size:.8rem;}
.safety{display:flex;gap:8px;align-items:flex-start;margin-top:12px;}
.safety .i{margin-top:2px;color:var(--maybe);}
.side-cmt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:10px 0;border-bottom:1px solid var(--line);font-size:.92rem;}
.side-cmt:last-child{border-bottom:0;}
.pro-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.pro-row:last-child{border-bottom:0;}
.pro-row .btn{flex:none;min-height:36px;padding:0 10px;font-size:.82rem;border-radius:10px;}
.pro-row .link-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;display:inline-block;vertical-align:bottom;}
html:not(.desk) .fp-who{flex:1 1 calc(100% - 110px);}
html:not(.desk) .fp-head{flex-wrap:wrap;row-gap:6px;}
html:not(.desk) .fp-head .ptag{margin-left:42px;}
.fp-who .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prof-btn .btn{flex:0 1 auto;}
.types4{display:grid;gap:10px;}
.desk .types4{grid-template-columns:1fr 1fr;}
.swatches{display:flex;gap:10px;flex-wrap:wrap;}
.swc{width:42px;height:42px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);}
.swc[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink);}
.slide-row{display:flex;gap:8px;align-items:flex-start;margin-top:8px;}
.slide-row textarea{min-height:64px;}
.slide-n{width:28px;height:28px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.8rem;margin-top:14px;flex:none;}
textarea.tall{min-height:220px;}
.desk .preview-panel{position:sticky;top:104px;}
.preview-panel .fpost{border:0;padding:0;}
.sheet-back{position:fixed;inset:0;background:var(--scrim);z-index:45;display:flex;align-items:flex-end;}
.sheet{width:100%;background:var(--surface);border-radius:20px 20px 0 0;padding:14px 12px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:4px;}
.sheet-title{font-weight:700;padding:4px 16px 8px;color:var(--muted);font-size:.85rem;}
.sheet button{display:flex;align-items:center;gap:14px;min-height:56px;padding:0 16px;border:0;background:none;border-radius:12px;font-weight:700;font-size:1.05rem;color:var(--ink);}
.sheet button .i{width:22px;height:22px;}
.sheet button[aria-current="page"]{background:var(--primary-soft);color:var(--primary);}
/* ---------- ajuste de usabilidade: tamanhos, alinhamento e seleções ---------- */

html.desk{--fs:15px;}
html.desk.big{--fs:18px;}
.hello{font-size:1.45rem;}
.topbar h1{font-size:1.4rem;}
.panel{padding:16px;border-radius:16px;}

.btn{min-height:48px;font-size:1rem;border-radius:12px;padding:0 18px;white-space:nowrap;}

main{padding:16px 14px 100px;}
.sec-title{font-size:1.05rem;margin:22px 0 8px;}
.buy{grid-template-columns:40px 1fr auto;gap:10px;padding:10px 0;}
.face{width:40px;height:40px;}
.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}

.money input{min-height:52px;font-size:1.4rem;}
.money b{font-size:1.15rem;}
.money{border-radius:12px;}
.catgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}
.cat{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:74px;padding:8px 4px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:.78rem;line-height:1.15;text-align:center;color:var(--ink);}
.cat .i{width:24px;height:24px;color:var(--muted);}
.cat:hover{border-color:color-mix(in srgb,var(--primary) 50%,var(--line));}
.cat[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);}
.cat[aria-pressed="true"] .i{color:var(--primary);}
.cat .tick{position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:50%;background:var(--primary);display:grid;place-items:center;}
.cat .tick .i{width:12px;height:12px;color:var(--primary-ink);}
.emo-scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:18px;}
.emo-btn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 2px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:.74rem;line-height:1.15;text-align:center;color:var(--ink);}
.emo-btn .face{width:48px;height:48px;}
.desk .emo-btn .face{width:56px;height:56px;}
.emo-btn:hover,.emo-btn[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);}
.emo-track{height:8px;border-radius:4px;margin-top:12px;background:linear-gradient(90deg,var(--e1),var(--e2),var(--e3),var(--e4),var(--e5));}
.emo-ends{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-top:4px;}
.type{position:relative;padding-left:44px;min-height:50px;font-size:.95rem;}
.type::before{content:"";position:absolute;left:14px;top:50%;width:18px;height:18px;margin-top:-11px;border-radius:50%;border:2px solid var(--line);background:var(--surface);}
.type[aria-pressed="true"]::before{border-color:var(--primary);background:var(--primary);box-shadow:inset 0 0 0 3px var(--surface);}
.desk .type{min-height:44px;}
.emo-pick{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;}
.emo-pick button{width:auto;height:auto;aspect-ratio:1/1;border-radius:12px;display:grid;place-items:center;}
.desk .emo-pick{max-width:420px;}
.rtabs button{min-height:42px;}

html:not(.desk) .rtabs button{flex-direction:column;justify-content:center;gap:3px;min-height:54px;padding:4px 2px;font-size:.72rem;border:0;border-radius:10px;}

.linkbox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;}

.ev-ic{width:42px;height:42px;border-radius:12px;}
.check{min-height:46px;font-size:.95rem;}

.ach{padding:14px;gap:12px;grid-template-columns:48px 1fr;}
.ach-ic{width:48px;height:48px;}

.story-ring .av{width:54px;height:54px;}

.done-ic{width:76px;height:76px;}
.sims .btn{flex:1 1 220px;}

.prow{padding:12px;}
.av.lg{width:46px;height:46px;font-size:1rem;}
.kpi .cell-p{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:inherit;margin-top:4px;}
.kpi .face{display:grid;}

.hero-big b{color:var(--bad);}

.fee-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}

.debt{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);}

.debt-main{flex:1;min-width:0;}
.debt-tags{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:6px;}

.pay-row:last-of-type{border-bottom:0;}

.cls-row{padding:12px 0;border-bottom:1px solid var(--line);}

.cls-head{display:flex;justify-content:space-between;gap:10px;font-weight:700;}
.mini-faces{display:flex;gap:6px;margin:10px 0 8px;}

.mem-note{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);}

.type{flex-wrap:wrap;align-content:center;padding-top:10px;padding-bottom:10px;}

.goal-stats{flex:1;min-width:0;}
.gs-main{font-size:1.6rem;font-weight:700;line-height:1.1;}
.gs-line{margin-top:6px;font-size:.92rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.gs-line .i{color:var(--good);}
.goal-actions{margin-top:14px;}
.dep-box{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
.goal-hero{text-align:center;}
.goal-hero .goal-head{text-align:left;}
.goal-hero-ring{display:flex;justify-content:center;margin:18px 0 12px;}
.goal-msg{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;margin-bottom:14px;}
.goal-msg.good{color:var(--good);}
.goal-hero .plan-stats{grid-template-columns:repeat(4,minmax(0,1fr));text-align:left;}
html:not(.desk) .goal-hero .plan-stats{grid-template-columns:1fr 1fr;}
html:not(.desk) .goal-hero .plan-stats>div:first-child{grid-column:auto;}
.dep-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--good-soft);flex:none;}
.dep-ic .i{width:16px;height:16px;color:var(--good);}
.seg-tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:4px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);}
.seg-tabs button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;border:0;border-radius:9px;background:none;font-weight:700;font-size:.9rem;color:var(--muted);white-space:nowrap;}
.seg-tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line);}
.seg-tabs .i{width:16px;height:16px;}
.goal-calc{margin-top:16px;}
.freq-opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
.freq-opt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);text-align:center;}
.freq-opt b{font-size:1.1rem;}
.freq-opt[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);}
.calc-out{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:var(--primary-soft);}
.calc-out>.i{width:26px;height:26px;color:var(--primary);flex:none;}
.calc-out>div{display:flex;flex-direction:column;}
.calc-out b{font-size:1.15rem;}
.mini-rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
.mini-ring{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;color:var(--ink);font-size:.8rem;font-weight:700;text-align:center;line-height:1.2;}
input:disabled{opacity:.55;}
html:not(.desk) .goal-head{flex-wrap:wrap;row-gap:6px;}
html:not(.desk) .goal-head h3{flex:1 1 calc(100% - 50px);}
html:not(.desk) .goal-head .status{margin-left:46px;}

/* ---------- revisão de alinhamento 2 ---------- */
.two{align-items:end;}
input[type="number"]::-webkit-inner-spin-button,input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
input[type="number"]{-moz-appearance:textfield;appearance:textfield;}
.affix{display:flex;align-items:center;border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px;gap:6px;}
.affix:focus-within{border-color:var(--primary);}
.affix b{color:var(--muted);font-weight:700;flex:none;}
.affix .input{border:0;padding:0;min-height:44px;background:none;flex:1;min-width:0;}
.affix .input:focus{border:0;}
html:not(.desk) .catgrid.five{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;}
.catgrid.five .cat{min-height:66px;font-size:.72rem;padding:6px 2px;}
.desk .catgrid.five .cat{font-size:.8rem;min-height:72px;}
.debt{display:grid;grid-template-columns:42px minmax(0,1fr) auto;column-gap:12px;row-gap:8px;align-items:start;}
.debt-name{display:flex;flex-direction:column;min-width:0;}
.debt-name b{line-height:1.25;}
.debt-val{display:flex;flex-direction:column;align-items:flex-end;}
.debt-tags{grid-column:2/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:0;}
.debt-tags .tag{margin-top:0;}
.debt-edit{margin-left:auto;min-height:32px;}
.desk .debt-form{max-width:760px;}
.budget-chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px;}
.budget-chips .chip{width:100%;justify-content:center;padding:0 4px;}
.chat-head b{white-space:nowrap;}
html:not(.desk) .chat-head .sub{display:none;}
.ai-badge{flex:none;}
html:not(.desk) .cmd{grid-template-columns:1fr;gap:4px;padding-bottom:8px;border-bottom:1px solid var(--line);}
html:not(.desk) .cmd:last-child{border-bottom:0;}
html:not(.desk) .cmd code{justify-self:start;}
.eval .i,.seg .i{margin-right:6px;}
.eval button{display:inline-flex;align-items:center;justify-content:center;}
.hero-kicker.plain{color:var(--primary);}
.bills-sum .hero-big b{color:var(--ink);}
.paid-bar{height:12px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;margin-top:12px;}
.paid-bar i{display:block;height:100%;background:var(--good);border-radius:6px;}
.paid-legend{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;margin-top:6px;color:var(--muted);}
.paid-legend b{color:var(--ink);}
.paid-legend b.good{color:var(--good);}
.bill-split{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px;}
.bill-split>div{display:flex;flex-direction:column;gap:2px;padding:10px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);}
.bill-split b{font-size:1rem;}
.inc-edit{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
.bill{display:grid;grid-template-columns:44px 36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
.bill:last-of-type{border-bottom:0;}
.bill-date{width:44px;height:44px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;}
.bill-date b{font-size:1.05rem;} .bill-date span{font-size:.65rem;color:var(--muted);margin-top:2px;}
.bill-date.sm{width:34px;height:34px;border-radius:10px;}
.bill.is-late .bill-date{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);}
.bill.is-paid{opacity:.72;}
.bill-main .link-name{font-size:1rem;}
.bill-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);flex:none;}
.bill-ic .i{width:18px;height:18px;}
.bill-main{display:flex;flex-direction:column;min-width:0;}
.bill-main .sub{display:inline-flex;align-items:center;gap:4px;}
.bill-main .sub .i{width:13px;height:13px;color:var(--good);}
.bill-right{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
.bill-right>b{white-space:nowrap;}
.bill-pay{grid-column:1/-1;padding:10px 0 4px;}
html:not(.desk) .bill{grid-template-columns:44px minmax(0,1fr) auto;}
html:not(.desk) .bill .bill-ic{display:none;}
html:not(.desk) .bill-right{flex-direction:column;align-items:flex-end;gap:4px;}
html:not(.desk) .bill-right .iconbtn{display:none;}
html:not(.desk) .bill-main b{cursor:pointer;}
.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;}
.cal-head span{text-align:center;font-size:.75rem;font-weight:700;color:var(--muted);padding-bottom:4px;}
.cal-cell{aspect-ratio:1/1;border-radius:10px;border:1px solid transparent;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--ink);padding:0;}
.cal-cell.empty{visibility:hidden;}
.cal-cell[disabled]{cursor:default;color:var(--muted);}
.cal-n{font-size:.85rem;font-weight:700;line-height:1;}
.cal-v{font-size:.6rem;font-weight:700;line-height:1;}
.desk .cal-v{font-size:.68rem;}
.cal-cell.today{border-color:var(--ink);}
.cal-cell.paid{background:var(--good-soft);color:var(--good);}
.cal-cell.due{background:var(--maybe-soft);color:var(--maybe);}
.cal-cell.late{background:var(--bad-soft);color:var(--bad);}
.cal-cell.sel{box-shadow:0 0 0 2px var(--primary);}
.cal-legend{display:flex;gap:14px;justify-content:center;margin-top:10px;font-size:.8rem;color:var(--muted);}
.cal-legend span{display:inline-flex;align-items:center;gap:5px;}
.lg{width:10px;height:10px;border-radius:3px;display:inline-block;}
.lg.paid{background:var(--good);} .lg.due{background:var(--maybe);} .lg.late{background:var(--bad);}
.cat-row{display:grid;grid-template-columns:36px minmax(0,110px) 1fr auto;gap:10px;align-items:center;padding:6px 0;}
.cat-name{font-weight:700;font-size:.9rem;}
.cat-bar{height:10px;border-radius:5px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;}
.cat-bar i{display:block;height:100%;background:var(--primary);}
.catgrid.bills{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;}
.catgrid.bills .cat{min-height:66px;font-size:.72rem;padding:6px 2px;}
html:not(.desk) .catgrid.bills{grid-template-columns:repeat(5,minmax(0,1fr));}
.mini-bill{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
.mini-bill:last-of-type{border-bottom:0;}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;}}
@media (max-width:400px){.top .brand span.word{display:none;}.roles button{padding:7px 8px;font-size:.8rem;}}
</style>

function mkAt(){
  const now = new Date(); let clamp = 5;
  return (back,h,m) => {
    const d = new Date(now); d.setDate(now.getDate()-back); d.setHours(h,m,0,0);
    if(d > now){ clamp += 37; return new Date(now.getTime()-clamp*60000).toISOString(); }
    return d.toISOString();
  };
}

  const r = rng(seedN), at = mkAt(), purchases = [];

const byDay = (p,k) => p.purchases.filter(x => dk(new Date(x.ts)) === k).sort((a,b) => a.ts.localeCompare(b.ts));
const dayScore = (p,k) => { const l = byDay(p,k); return l.length ? avg(l.map(x=>x.emotion)) : null; };
const daySpend = (p,k) => byDay(p,k).reduce((s,x)=>s+x.value,0);
const emoOf = s => Math.min(5, Math.max(1, Math.round(s)));
const weekList = p => daysBack(7).flatMap(k=>byDay(p,k));
function weekScore(p){ const sc = daysBack(7).map(k=>dayScore(p,k)).filter(s=>s!=null); return sc.length ? avg(sc) : null; }
function scoreLabel(s){
  if(s==null) return "Sem compras";
  if(s<1.75) return "Dia muito triste"; if(s<2.5) return "Dia triste"; if(s<3.5) return "Dia normal"; if(s<4.25) return "Dia feliz"; return "Dia muito feliz";
}
function dayName(k){
  if(k===todayKey()) return "Hoje";
  const y = new Date(); y.setDate(y.getDate()-1);
  if(k===dk(y)) return "Ontem";
  return cap(keyToDate(k).toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"short"}));
}
function progress(p,a){
  if(a.type==="registrar") return p.purchases.length;
  if(a.type==="nota_boa") return daysBack(30).filter(k => { const s = dayScore(p,k); return s!=null && s>=3; }).length;
  if(a.type==="sem_impulso"){ let n = 0; for(const k of daysBack(90).reverse()){ if(byDay(p,k).some(x=>x.need==="nao")) break; n++; } return n; }
  return 0;
}
function status(p){
  if(!p.purchases.length) return {c:"new",t:"Novo"};
  const s = weekScore(p), L = weekList(p), r = L.length ? L.filter(x=>x.need==="nao").length/L.length : 0;
  if((s!=null && s<2.6) || r>=0.5) return {c:"att",t:"Precisa de atenção"};
  if((s!=null && s<3.2) || r>=0.3) return {c:"mid",t:"Acompanhar"};
  return {c:"ok",t:"Estável"};
}
function insights(p){
  const P = p.purchases, out = [], who = UI.role==="pessoa" ? "você estava" : p.short+" estava";
  const low = P.filter(x=>x.emotion<=2), high = P.filter(x=>x.emotion>=4);
  const ratio = l => l.length ? Math.round(l.filter(x=>x.need==="nao").length/l.length*10) : null;
  const rl = ratio(low), rh = ratio(high);
  if(rl!=null) out.push({ic:"f2", t:`Quando ${who} triste, ${rl} de cada 10 compras não eram necessárias.`});
  if(rh!=null) out.push({ic:"f4", t:`Quando ${who} feliz, foram ${rh} de cada 10.`});
  const ks = daysBack(30).filter(k=>byDay(p,k).length);
  const lowD = ks.filter(k=>dayScore(p,k)<3), goodD = ks.filter(k=>dayScore(p,k)>=3);
  if(lowD.length && goodD.length) out.push({ic:"wallet", t:`Nos dias de nota baixa o gasto médio foi ${brl(avg(lowD.map(k=>daySpend(p,k))))}. Nos dias bons, ${brl(avg(goodD.map(k=>daySpend(p,k))))}.`});
  const night = P.filter(x=>{ const h = new Date(x.ts).getHours(); return h>=21 || h<5; });
  if(night.length>=2) out.push({ic:"moon", t:`Depois das 21h foram ${night.length} compras, e ${night.filter(x=>x.need==="nao").length} delas não eram necessárias.`});
  return out;
}

function addAlert(p,icon,text,extra){ p.alerts.unshift({id:uid(),ts:new Date().toISOString(),icon,text,...(extra||{})}); }
function addPurchase(p,x){
  const tk = todayKey();
  const live = (S.events||[]).filter(ev=>ev.kind==="desafio" && ev.start<=tk && ev.end>=tk && ev.parts.some(pt=>pt.pid===p.id && pt.joined<=tk));
  const okBefore = live.map(ev=>dayOk(p,ev,tk));
  p.purchases.push(x);
  live.forEach((ev,i)=>{ if(okBefore[i] && !dayOk(p,ev,tk)) p.chat.push({from:"bot",ts:new Date().toISOString(),text:`🎯 Essa compra ficou fora da regra do desafio ${ev.name} hoje (${ruleText(ev)}).\nTudo bem: amanhã é um novo dia.`}); });
  if(p.notify.big && x.value >= p.notify.bigValue) addAlert(p,"💸",`${p.short} registrou uma compra de ${brl(x.value)} (${x.item}).`);
  const s = dayScore(p,todayKey());
  if(p.notify.low && s!=null && s<=2 && !p.alerts.some(a=>a.lowDay===todayKey())) addAlert(p,"😕",`A nota do dia de ${p.short} está em ${fmt1(s)} (${scoreLabel(s)}).`,{lowDay:todayKey()});
  checkUnlocks(p); save();
}
function checkUnlocks(p){
  p.achievements.forEach(a => {
    if(!a.done && progress(p,a) >= a.target){
      a.done = true;
      p.chat.push({from:"bot",ts:new Date().toISOString(),text:`🏆 Conquista desbloqueada!\n${a.emoji} ${a.title}` + (a.reward ? `\nSeu prêmio: ${a.reward}` : "")});
      addAlert(p,"🏆",`${p.short} desbloqueou a conquista ${a.title}.`);
      UI.toast = `Conquista desbloqueada: ${a.title}`;
    }
  });
}

/* ---------- eventos ---------- */
const RULES = {
  sem_desnecessaria:{t:"Nenhuma compra não necessária", d:"O dia conta se nenhuma compra for marcada como não necessária."},
  sem_categoria:{t:"Não comprar de uma categoria", d:"Por exemplo, nada de comida por aplicativo enquanto o desafio durar."},
  limite_dia:{t:"Gastar no máximo um valor por dia", d:"O dia conta se a soma das compras ficar dentro do limite."},
  nota_boa:{t:"Comprar só estando bem", d:"O dia conta se a nota do dia for 3 ou mais, ou se não houver compras."}
};
const pById = id => S.patients.find(p=>p.id===id);
function keyAdd(k,n){ const d = keyToDate(k); d.setDate(d.getDate()+n); return dk(d); }
function rangeKeys(a,b){ const r = []; let k = a, g = 0; while(k<=b && g<120){ r.push(k); k = keyAdd(k,1); g++; } return r; }
const evDays = ev => rangeKeys(ev.start, ev.end);
const fmtDate = k => keyToDate(k).toLocaleDateString("pt-BR",{day:"numeric",month:"short"});
const fmtDateLong = k => cap(keyToDate(k).toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"}));
const evWhen = ev => ev.kind==="desafio" ? `${fmtDate(ev.start)} a ${fmtDate(ev.end)}` : `${fmtDateLong(ev.date)}, ${ev.time}`;
const inviteUrl = ev => location.href.split("#")[0]+"#convite-"+ev.id;
const ageTxt = p => p.age ? `${p.age} anos` : "Idade não informada";
function ruleText(ev){
  if(ev.rule==="sem_categoria") return `Nenhuma compra de ${ev.cat}`;
  if(ev.rule==="limite_dia") return `Gastar no máximo ${brl(Number(ev.limit)||0)} por dia`;
  if(ev.rule==="nota_boa") return "Comprar só estando bem: nota do dia 3 ou mais";
  return "Nenhuma compra não necessária";
}
function evStatus(ev){
  const t = todayKey(), start = ev.kind==="desafio" ? ev.start : ev.date, end = ev.kind==="desafio" ? ev.end : ev.date;
  if(t<start){ const n = rangeKeys(t,start).length-1; return {c:"soon",t:n===1?"Começa amanhã":`Começa em ${n} dias`}; }
  if(t>end) return {c:"end",t:"Encerrado"};
  if(ev.kind==="desafio"){ const d = evDays(ev); return {c:"live",t:`Dia ${d.indexOf(t)+1} de ${d.length}`}; }
  return {c:"live",t:"É hoje"};
}
function dayOk(p,ev,k){
  const l = byDay(p,k);
  if(ev.rule==="sem_categoria") return !l.some(x=>x.cat===ev.cat);
  if(ev.rule==="limite_dia") return daySpend(p,k) <= (Number(ev.limit)||0);
  if(ev.rule==="nota_boa"){ const s = dayScore(p,k); return s==null || s>=3; }
  return !l.some(x=>x.need==="nao");
}
function partProgress(p,ev,pt){
  const t = todayKey(), days = evDays(ev), el = days.filter(k=>k<=t && k>=pt.joined), ok = el.filter(k=>dayOk(p,ev,k)).length;
  let streak = 0; for(const k of el.slice().reverse()){ if(dayOk(p,ev,k)) streak++; else break; }
  return {days,el,ok,streak};
}
function groupPct(ev){
  let ok = 0, tot = 0;
  ev.parts.forEach(pt=>{ const p = pById(pt.pid); if(!p) return; const r = partProgress(p,ev,pt); ok += r.ok; tot += r.el.length; });
  return tot ? Math.round(ok/tot*100) : null;
}
function dotsFor(p,ev,pt){
  const t = todayKey();
  return evDays(ev).map((k,i)=>{
    const fut = k>t, before = k<pt.joined, cls = fut ? "fut" : before ? "" : (dayOk(p,ev,k) ? "ok" : "no");
    return `<span class="dd ${cls} ${k===t?"today":""}" title="${fmtDate(k)}">${fut||before ? i+1 : ic(cls==="ok"?"check":"x")}</span>`;
  }).join("");
}

function points(p,ev,pt){

/* ---------- módulo de dívidas: motor financeiro (código puro, sem IA) ---------- */
const DEBT_SHORT = {cartao:"Cartão",cheque:"Cheque",emprestimo:"Empréstimo",parcelamento:"Parcelado",outra:"Outra"};
const DEBT_KINDS = {cartao:["credit-card","Cartão de crédito"],cheque:["landmark","Cheque especial"],emprestimo:["banknote","Empréstimo"],parcelamento:["receipt","Parcelamento"],outra:["wallet","Outra dívida"]};
const LINE_KINDS = {compra:"Compra",encargo:"Juros",iof:"IOF",tarifa:"Tarifa",assinatura:"Assinatura",entrada:"Pagamento ou entrada"};
const monthKey = (d=new Date()) => d.getFullYear()+"-"+pad(d.getMonth()+1);
const pct = n => n.toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+"%";
const minSum = p => p.debts.reduce((a,d)=>a+(d.balance>0?d.minPay:0),0);
const totalDebt = p => p.debts.reduce((a,d)=>a+d.balance,0);
function monthLabel(n){ const d = new Date(); d.setMonth(d.getMonth()+n); return d.toLocaleDateString("pt-BR",{month:"long",year:"numeric"}); }
function simulate(debts, budget, strategy){
  const ds = debts.filter(d=>d.balance>0.005).map(d=>({id:d.id,name:d.name,bal:d.balance,rate:d.rate/100,min:d.minPay}));
  let month = 0, totalInt = 0; const payoff = {}, first = {}, timeline = [ds.reduce((a,d)=>a+d.bal,0)];
  while(ds.some(d=>d.bal>0.005) && month<360){
    month++;
    ds.forEach(d=>{ if(d.bal>0.005){ const i = d.bal*d.rate; d.bal += i; totalInt += i; } });
    let money = Math.max(0, budget);
    ds.forEach(d=>{ if(d.bal>0.005 && money>0){ const pay = Math.min(d.min, d.bal, money); d.bal -= pay; money -= pay; if(month===1) first[d.id] = (first[d.id]||0)+pay; } });
    const order = ds.filter(d=>d.bal>0.005).sort(strategy==="bola" ? (a,b)=>a.bal-b.bal : (a,b)=>b.rate-a.rate);
    for(const d of order){ if(money<=0.005) break; const pay = Math.min(d.bal, money); d.bal -= pay; money -= pay; if(month===1) first[d.id] = (first[d.id]||0)+pay; }
    ds.forEach(d=>{ if(d.bal<=0.005 && !payoff[d.id]){ payoff[d.id] = month; d.bal = 0; } });
    timeline.push(ds.reduce((a,d)=>a+d.bal,0));
  }
  return {months:month, totalInt, payoff, first, timeline, done:!ds.some(d=>d.bal>0.005)};
}
function interest12(debts){
  const ds = debts.filter(d=>d.balance>0).map(d=>({bal:d.balance,rate:d.rate/100,min:d.minPay})); let tot = 0;
  for(let m=0;m<12;m++) ds.forEach(d=>{ if(d.bal>0.005){ const i = d.bal*d.rate; tot += i; d.bal = Math.max(0, d.bal+i-d.min); } });
  return tot;
}
const monthInterest = p => p.debts.reduce((a,d)=>a+d.balance*d.rate/100,0);
const niceDesc = d => cap(d.toLowerCase()).replace(/\biof\b/gi,"IOF");
const isFee = l => ["encargo","iof","tarifa"].includes(l.kind);
function monthFees(p){
  const mk = monthKey(), inv = p.invoices.filter(i=>i.month===mk), lines = inv.flatMap(i=>i.lines);
  const sum = k => lines.filter(l=>l.kind===k).reduce((a,l)=>a+l.value,0);
  return {juros:sum("encargo"), iof:sum("iof"), tarifas:sum("tarifa"), total:sum("encargo")+sum("iof")+sum("tarifa"), count:inv.length};
}
function planFor(p){ const b = Math.max(p.plan.budget, minSum(p)); return simulate(p.debts, b, p.plan.strategy); }
function compareExtra(p, extra){
  const base = simulate(p.debts, minSum(p), "avalanche"), plan = simulate(p.debts, minSum(p)+extra, "avalanche");
  return {base, plan, saved: base.totalInt - plan.totalInt, monthsSaved: base.months - plan.months};
}
function emotionalCost(p){
  const mk = monthKey(), cards = p.invoices.filter(i=>i.month===mk && i.type==="fatura");
  let fees = 0, tot = 0, nao = 0, sad = 0;
  cards.forEach(inv=>{ fees += inv.lines.filter(l=>l.kind==="encargo"||l.kind==="iof").reduce((a,l)=>a+l.value,0);
    inv.lines.filter(l=>l.kind==="compra").forEach(l=>{ tot += l.value; const x = l.pid && p.purchases.find(y=>y.id===l.pid); if(x){ if(x.need==="nao") nao += l.value; if(x.emotion<=2) sad += l.value; } }); });
  if(!tot || !fees) return null;
  return {fees, shareNao:nao/tot, shareSad:sad/tot, costNao:fees*nao/tot, costSad:fees*sad/tot};
}
function subsList(p){
  const seen = {}, out = [];
  p.invoices.forEach(inv=>inv.lines.filter(l=>l.kind==="assinatura"||l.kind==="tarifa").forEach(l=>{ if(!seen[l.desc]){ seen[l.desc] = 1; out.push(l); } }));
  return out;
}
function paymentsThisMonth(p){
  const r = planFor(p), mk = monthKey();
  return p.debts.filter(d=>d.balance>0).map(d=>({d, amount:r.first[d.id]||0, paid:!!p.plan.paid[mk+":"+d.id]})).sort((a,b)=>a.d.due-b.d.due);
}

function seedInvoices(p){
  if(p.id!=="ana") return [];
  const now = new Date(), d = n => { const x = new Date(now); x.setDate(Math.max(1, now.getDate()-n)); return dk(x); };

function ciReply(p, slot, mood){

function recordCheckin(p, slot, mood, fromChat){

function buildTurns(p, ctx){
  const msgs = p.chat.filter(m=>!m.typing && m.text).slice(-12).map(m=>({role:m.from==="me"?"user":"assistant",content:m.text}));
  const out = [{role:"user",content:ctx+"\n\nA seguir, a conversa recente. Responda à última mensagem da pessoa."},{role:"assistant",content:"Entendido."}];
  msgs.forEach(m=>{ const last = out[out.length-1]; if(last.role===m.role) last.content += "\n"+m.content; else out.push({...m}); });
  if(out[out.length-1].role!=="user") out.push({role:"user",content:"(continue a conversa)"});
  return out;
}

async function aiAnswer(p, text, preview){

  const input = preview ? [{role:"user",content:ctx+"\n\nMensagem da pessoa:\n"+text}] : buildTurns(p, ctx);
  try{ const r = await sample(input,{modelTier:"quick",cache:false}); return {text:(r.text||"").trim()||ruleReply(p,text), ai:true}; }
  catch(e){ if(e && e.code==="not_granted") UI.ai = false; return {text:ruleReply(p,text), ai:false}; }
}
function agentReply(p, text){

const GOAL_ICONS = ["piggy-bank","shield","plane","home","car","graduation-cap","gift","smartphone","heart"];
const GOAL_COLORS = {azul:"#3B6FE0",amarelo:"#E8B931",coral:"#E8455A",violeta:"#8B5CF6",petroleo:"#14A3A0"};
const FREQ = {dia:["dia","por dia",1],semana:["semana","por semana",7],mes:["mês","por mês",30]};
const fmtR = v => (Math.abs(v-Math.round(v))<0.005 ? Math.round(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0}) : brl(v));
const ceil2 = v => Math.ceil(v*100-1e-6)/100;
const savedOf = g => g.deposits.reduce((a,d)=>a+d.value,0);
const daysBetween = (a,b) => Math.round((keyToDate(b)-keyToDate(a))/86400000);
function monthsBetween(a,b){ const x = keyToDate(a), y = keyToDate(b); let m = (y.getFullYear()-x.getFullYear())*12 + (y.getMonth()-x.getMonth()); if(y.getDate()<x.getDate()) m--; return m; }
function addPeriods(k, freq, n){ const d = keyToDate(k); if(freq==="mes") d.setMonth(d.getMonth()+n); else d.setDate(d.getDate()+n*FREQ[freq][2]); return dk(d); }
const longDate = k => keyToDate(k).toLocaleDateString("pt-BR",{day:"numeric",month:"long",year:"numeric"});
function optionsForDeadline(remaining, deadline){
  const t = todayKey(), days = Math.max(1, daysBetween(t, deadline));
  const weeks = Math.max(1, Math.floor(days/7)), months = Math.max(1, monthsBetween(t, deadline));
  return {days, weeks, months, dia:ceil2(remaining/days), semana:ceil2(remaining/weeks), mes:ceil2(remaining/months)};
}
function finishDate(remaining, amount, freq){ if(!(amount>0)) return null; const n = Math.ceil(remaining/amount - 1e-9); return {n, date:addPeriods(todayKey(), freq, n)}; }
function goalStatus(g){
  const saved = savedOf(g), rem = Math.max(0, g.target-saved), done = saved >= g.target - 0.005;
  if(done) return {done:true, saved, rem:0, pct:1, label:"Concluída", cls:"ok"};
  const len = FREQ[g.freq][2], elapsed = Math.max(0, daysBetween(g.created, todayKey()));
  const periods = g.freq==="mes" ? Math.max(0, monthsBetween(g.created, todayKey())) : Math.floor(elapsed/len);
  const expected = Math.min(g.target, (g.initial||0) + g.amount*periods), diff = saved - expected;
  const fin = finishDate(rem, g.amount, g.freq);
  let label, cls;
  if(diff >= -0.005){ label = diff>g.amount*0.5 ? "Adiantada" : "Em dia"; cls = "ok"; } else { label = `Faltam ${fmtR(-diff)} para ficar em dia`; cls = "mid"; }
  const late = g.deadline && fin && fin.date > g.deadline;
  return {done:false, saved, rem, pct:saved/g.target, label, cls, fin, late, behind:Math.max(0,-diff)};
}
function ring(p, color, size, stroke, center, anim){
  const r = (size-stroke)/2, c = 2*Math.PI*r, v = Math.max(0, Math.min(1, p)), off = c*(1-v), done = v>=0.9999, col = done ? "var(--good)" : color, h = size/2;
  const ang = -Math.PI/2 + 2*Math.PI*v, tx = h + r*Math.cos(ang), ty = h + r*Math.sin(ang), rot = ang*180/Math.PI + 90, s = stroke*0.28;
  const arrow = v>0.04 && !done ? `<path class="ring-tip ${anim?"anim":""}" d="M ${-s} 0 H ${s} M ${s*0.25} ${-s*0.75} L ${s} 0 L ${s*0.25} ${s*0.75}" transform="translate(${tx.toFixed(1)} ${ty.toFixed(1)}) rotate(${rot.toFixed(1)})" fill="none" stroke="rgba(10,15,25,.7)" stroke-width="${Math.max(1.6,stroke/8)}" stroke-linecap="round" stroke-linejoin="round"/>` : "";
  return `<div class="ring" style="width:${size}px;height:${size}px;--rc:${col}"><svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true">
    <circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="color-mix(in srgb,var(--rc) 20%,transparent)" stroke-width="${stroke}"/>
    ${v>0?`<circle class="ring-arc ${anim?"anim":""}" cx="${h}" cy="${h}" r="${r}" fill="none" stroke="var(--rc)" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${done?0:off.toFixed(2)}" transform="rotate(-90 ${h} ${h})" style="--full:${c.toFixed(2)};--off:${done?0:off.toFixed(2)}"/>`:""}
    ${arrow}</svg><div class="ring-center">${center}</div></div>`;
}

  return p.goals.map(g=>{ const st = goalStatus(g); return `${g.name}: meta ${brl(g.target)}, guardado ${brl(st.saved)} (${Math.floor(st.pct*100)}%)${st.done?", concluída":`, plano ${brl(g.amount)} ${FREQ[g.freq][1]}, ${st.label.toLowerCase()}${st.fin?`, termina em ${longDate(st.fin.date)}`:""}`}`; }).join("\n");
}
function addDeposit(p, g, value){
  const before = goalStatus(g).done;
  g.deposits.push({id:uid(),ts:new Date().toISOString(),value});
  const st = goalStatus(g);
  if(st.done && !before){
    addAlert(p,"🎯",`${p.short} completou a meta ${g.name} (${fmtR(g.target)}).`);
    p.chat.push({from:"bot",ts:new Date().toISOString(),text:`🎉 Meta completa: ${g.name}!\nVocê juntou ${fmtR(st.saved)}. Que orgulho!`});
    UI.toast = `Meta completa: ${g.name}!`;
  } else UI.toast = `${fmtR(value)} guardados em ${g.name}. Faltam ${fmtR(st.rem)}.`;
  save();
}

const BILL_CATS = {moradia:["home","Moradia"],luz:["zap","Luz"],agua:["droplet","Água"],internet:["wifi","Internet e celular"],transporte:["bus","Transporte"],saude:["heart-pulse","Saúde"],educacao:["graduation-cap","Educação"],assinatura:["tv","Assinatura"],outra:["receipt","Outra"]};
const BILL_SHORT = {moradia:"Moradia",luz:"Luz",agua:"Água",internet:"Internet",transporte:"Transporte",saude:"Saúde",educacao:"Educação",assinatura:"Assinatura",outra:"Outra"};
const daysInMonth = (d=new Date()) => new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
const dueDay = due => Math.min(due, daysInMonth());
function seedBills(id){
  if(id!=="ana") return id==="carlos" ? [{id:"b-c1",name:"Aluguel",cat:"moradia",amount:900,due:5,variable:false,auto:false,remind:true,paid:{}}] : [];
  const mk = monthKey(), td = new Date().getDate(), B = (bid,name,cat,amount,due,o) => ({id:bid,name,cat,amount,due,variable:false,auto:false,remind:true,paid:{},...(o||{})});
  const list = [
    B("b-aluguel","Aluguel","moradia",200,10), B("b-luz","Conta de luz","luz",95,12,{variable:true}), B("b-agua","Conta de água","agua",48,18,{variable:true}),
    B("b-net","Internet","internet",99.90,15,{auto:true}), B("b-cel","Celular","internet",49.90,22), B("b-bus","Cartão de ônibus","transporte",180,5),
    B("b-stream","Streaming de vídeo","assinatura",39.90,9,{auto:true})];
  list.forEach(b=>{ if(!b.auto && b.due < td && b.id!=="b-luz") b.paid[mk] = {ts:new Date().toISOString(), value:b.amount}; });
  return list;
}
function billState(b){
  const mk = monthKey(), td = new Date().getDate(), d = dueDay(b.due), rec = b.paid[mk];
  const paid = !!rec || (b.auto && d <= td);
  const value = rec && rec.value ? rec.value : b.amount;
  const overdue = !paid && d < td, soon = !paid && d >= td && d - td <= 3;
  return {paid, value, overdue, soon, day:d, auto:b.auto && !rec};
}
function monthCommitments(p){
  const bills = p.bills.map(b=>({type:"bill", b, ...billState(b)}));
  const debts = p.debts.length ? paymentsThisMonth(p).map(x=>({type:"debt", d:x.d, value:x.amount, paid:x.paid, day:dueDay(x.d.due), overdue:!x.paid && dueDay(x.d.due) < new Date().getDate(), soon:false})) : [];
  return {bills, debts, all:[...bills, ...debts]};
}
function billTotals(p){
  const c = monthCommitments(p), sum = l => l.reduce((a,x)=>a+x.value,0);
  const billsTotal = sum(c.bills), debtsTotal = sum(c.debts), total = billsTotal + debtsTotal, paid = sum(c.all.filter(x=>x.paid));
  const inc = p.income && p.income.amount ? p.income.amount : 0;
  return {c, billsTotal, debtsTotal, total, paid, pending: total - paid, income: inc, left: inc ? inc - total : null};
}
function billFacts(p){
  if(!p.bills.length) return "Sem contas fixas cadastradas.";
  const t = billTotals(p), nx = t.c.all.filter(x=>!x.paid).sort((a,b)=>a.day-b.day).slice(0,3);
  return [`Contas fixas do mês: ${brl(t.billsTotal)} (${p.bills.map(b=>`${b.name} ${b.variable?"cerca de ":""}${brl(b.amount)} dia ${b.due}`).join("; ")}).`,
    t.debtsTotal ? `Parcelas de dívidas pelo plano: ${brl(t.debtsTotal)}.` : "",
    `Já pago neste mês: ${brl(t.paid)}. Falta pagar: ${brl(t.pending)}.`,
    t.income ? `Renda informada: ${brl(t.income)} por mês. Depois das contas fixas e parcelas sobram ${brl(t.left)}.` : "Renda não informada.",
    nx.length ? `Próximos vencimentos: ${nx.map(x=>`${x.type==="bill"?x.b.name:x.d.name} dia ${x.day} (${brl(x.value)})${x.overdue?" VENCIDA":""}`).join("; ")}.` : "Tudo pago neste mês."].filter(Boolean).join("\n");
}

function billsCalendar(p){
  const now = new Date(), dim = daysInMonth(now), first = new Date(now.getFullYear(), now.getMonth(), 1).getDay(), td = now.getDate(), c = monthCommitments(p).all;
  const sel = UI.billDay;
  let cells = "";
  for(let i=0;i<first;i++) cells += `<span class="cal-cell empty"></span>`;
  for(let d=1; d<=dim; d++){
    const items = c.filter(x=>x.day===d), tot = items.reduce((a,x)=>a+x.value,0);
    const st = !items.length ? "" : items.every(x=>x.paid) ? "paid" : items.some(x=>x.overdue) ? "late" : "due";
    cells += `<button class="cal-cell ${d===td?"today":""} ${st} ${sel===d?"sel":""}" ${items.length?`data-a="billDay" data-v="${d}"`:"disabled"} aria-label="Dia ${d}${items.length?`: ${items.length} ${items.length===1?"conta":"contas"}, ${brl(tot)}`:""}"><span class="cal-n">${d}</span>${items.length?`<span class="cal-v">${tot>=1000?"R$"+(tot/1000).toFixed(1).replace(".",",")+"k":"R$"+Math.round(tot)}</span>`:""}</button>`;
  }
  return `<section class="panel"><div class="panel-head"><h2>Calendário do mês</h2>${sel?`<button class="btn-link mini" data-a="billDay" data-v="">Ver todas</button>`:""}</div>
    <div class="cal-head">${["D","S","T","Q","Q","S","S"].map(x=>`<span>${x}</span>`).join("")}</div><div class="cal-grid">${cells}</div>
    <div class="cal-legend"><span><i class="lg paid"></i>Pago</span><span><i class="lg due"></i>A pagar</span><span><i class="lg late"></i>Vencida</span></div></section>`;
}
