/* ---------- WhatsApp simulado ---------- */
function botSay(p,text,quick){ p.chat.push({from:"bot",ts:new Date().toISOString(),text,quick:quick||null}); }
function parseVal(s){
  let m = s.match(/\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?/);
  if(m) return parseFloat(m[0].replace(/\./g,"").replace(",","."));
  m = s.match(/\d+(?:[.,]\d{1,2})?/);
  return m ? parseFloat(m[0].replace(",",".")) : null;
}
const EMO_Q = [["1 😢"],["2 😕"],["3 😐"],["4 🙂"],["5 😄"]], NEED_Q = [["Sim"],["Não"],["Não sei"]];
function todaySummary(p,prefix){
  const k = todayKey(), l = byDay(p,k), s = dayScore(p,k);
  if(!l.length) return `${prefix}Hoje você não registrou compras. Comprou algo? É só me contar.`;
  return `${prefix}Hoje você registrou ${l.length} ${l.length===1?"compra":"compras"}, total de ${brl(daySpend(p,k))}.\nSua nota do dia: ${fmt1(s)} ${EMO[emoOf(s)].f} (${scoreLabel(s)}).\nEsqueceu alguma? É só me mandar.`;
}
function handleChat(raw){
  const p = cur(), text = raw.trim(); if(!text) return;
  p.chat.forEach(m=>{ m.quick = null; });
  p.chat.push({from:"me",ts:new Date().toISOString(),text});
  const low = text.toLowerCase(), P = UI.pend;
  if(CRISIS.test(low)){ UI.pend = null; UI.pendCI = null; botSay(p, crisisReply(p)); save(); return; }
  if(UI.pendCI && !P){
    let n = parseInt((low.match(/^[1-5]/)||[])[0]);
    if(!n){ if(/muito triste/.test(low)) n=1; else if(/muito feliz/.test(low)) n=5; else if(/triste|mal/.test(low)) n=2; else if(/feliz|bem/.test(low)) n=4; else if(/normal/.test(low)) n=3; }
    if(n){ const slot = UI.pendCI; UI.pendCI = null; recordCheckin(p, slot, n, true); return; }
    UI.pendCI = null;
  }
  if(P){
    if(P.step==="valor"){
      const v = parseVal(low);
      if(v==null || v<=0) botSay(p,"Não entendi o valor. Escreva só o número, por exemplo: 49,90");
      else { P.value = v; P.step = "emocao"; botSay(p,"Como você estava na hora da compra?\n1 😢 Muito triste\n2 😕 Triste\n3 😐 Normal\n4 🙂 Feliz\n5 😄 Muito feliz",EMO_Q); }
    } else if(P.step==="emocao"){
      let n = parseInt((low.match(/[1-5]/)||[])[0]);
      if(!n){ if(/muito triste/.test(low)) n=1; else if(/muito feliz/.test(low)) n=5; else if(/triste/.test(low)) n=2; else if(/feliz/.test(low)) n=4; else if(/normal/.test(low)) n=3; }
      if(!n) botSay(p,"Responda com um número de 1 a 5, ou toque numa carinha.",EMO_Q);
      else { P.emotion = n; P.step = "need"; botSay(p,"Essa compra era necessária?",NEED_Q); }
    } else if(P.step==="need"){
      let need = null;
      if(/n[aã]o sei|talvez|sei l[aá]/.test(low)) need = "talvez"; else if(/^n[aã]o/.test(low)) need = "nao"; else if(/^sim|^s$/.test(low)) need = "sim";
      if(!need) botSay(p,"Responda Sim, Não ou Não sei.",NEED_Q);
      else {
        const x = {id:uid(),ts:new Date().toISOString(),item:P.item,cat:"Outro",value:P.value,emotion:P.emotion,need,pro:null,via:"whatsapp"};
        UI.pend = null; const s0 = p.chat.length;
        addPurchase(p,x);
        const s = dayScore(p,todayKey());
        let msg = `Anotado ✅ ${x.item}, ${brl(x.value)}.\nVocê estava: ${EMO[x.emotion].f} ${EMO[x.emotion].t}\nEra necessária: ${need==="sim"?"Sim":need==="nao"?"Não":"Não sei"}\n\nSua nota de hoje agora é ${fmt1(s)} ${EMO[emoOf(s)].f} (${scoreLabel(s)}).`;
        if(x.emotion<=2 && need==="nao") msg += "\n\nSe quiser, me conta o que aconteceu antes dessa compra. Isso ajuda a achar o padrão.";
        p.chat.splice(s0,0,{from:"bot",ts:new Date().toISOString(),text:msg});
      }
    }
    save(); return;
  }
  const rs = low.match(/^(vou|talvez|n[aã]o vou)$/);
  if(rs){
    const ev = S.events.find(e=>e.id===UI.pendEv) || S.events.filter(e=>e.kind==="presencial" && evStatus(e).c!=="end" && e.parts.some(x=>x.pid===p.id)).sort((a,b)=>a.date.localeCompare(b.date))[0];
    const pt = ev && ev.parts.find(x=>x.pid===p.id);
    if(pt){ pt.rsvp = rs[1]==="vou" ? "vou" : rs[1]==="talvez" ? "talvez" : "nao"; UI.pendEv = null;
      botSay(p, pt.rsvp==="vou" ? `Anotado ✅ Você vai em ${ev.name}. Te lembro antes de começar.` : pt.rsvp==="talvez" ? `Anotado. Marquei talvez para ${ev.name}. Se decidir, é só me dizer.` : `Anotado. Você não vai em ${ev.name}. Obrigado por avisar.`);
      save(); return; }
  }
  if(/^(resumo|hoje|nota)/.test(low)){ botSay(p,todaySummary(p,"")); save(); return; }
  if(UI.pendGoal){ const pg = UI.pendGoal; UI.pendGoal = null; const g = p.goals.find(x=>low.includes(x.name.toLowerCase().slice(0,6)) || x.name.toLowerCase()===low);
    if(g){ addDeposit(p, g, pg.value); const st = goalStatus(g); botSay(p, st.done?`🎉 Meta completa: ${g.name}! Você juntou ${fmtR(st.saved)}.`:`Anotado ✅ ${fmtR(pg.value)} em ${g.name}. Agora você tem ${Math.floor(st.pct*100)}% e faltam ${fmtR(st.rem)}.`); save(); return; } }
  const gm = low.match(/^(guardei|juntei|economizei|separei)\s*(r\$)?\s*([\d.,]+)/);
  if(gm){ const val = parseVal(gm[3]), act0 = p.goals.filter(g=>!goalStatus(g).done);

    if(!act0.length){ botSay(p,"Você ainda não tem uma meta ativa. Crie uma na aba Metas e eu acompanho com você."); save(); return; }
    if(act0.length===1){ const g = act0[0]; addDeposit(p, g, val); const st = goalStatus(g); botSay(p, st.done?`🎉 Meta completa: ${g.name}! Você juntou ${fmtR(st.saved)}.`:`Anotado ✅ ${fmtR(val)} em ${g.name}. Agora você tem ${Math.floor(st.pct*100)}% e faltam ${fmtR(st.rem)}.`); save(); return; }
    UI.pendGoal = {value:val}; botSay(p, `Boa! Em qual meta você guardou ${fmtR(val)}?`, act0.map(g=>[g.name])); save(); return; }
  if(/^(plano|meu plano)/.test(low) && p.debts.length){ const r = planFor(p); botSay(p,`Seu plano: pagar ${brl(Math.max(p.plan.budget,minSum(p)))} por mês, ${p.plan.strategy==="bola"?"menor dívida primeiro":"mais cara primeiro"}.\nVocê fica livre das dívidas em ${r.months} meses (${monthLabel(r.months)}), com ${brl(r.totalInt)} de juros até lá.\nSimulação educativa. Quer testar outro valor? Pergunte: e se eu pagar 200 a mais?`); save(); return; }
  const pg2 = low.match(/^paguei\s*(?:a |o )?(?:conta (?:de |do |da ))?([a-zà-ú ]*?)\s*(?:r\$\s*)?([\d.,]+)?$/);
  if(pg2 && (p.bills.length || p.debts.length)){
    const word = (pg2[1]||"").trim(), val = pg2[2] ? parseVal(pg2[2]) : null;
    const pending = monthCommitments(p).all.filter(x=>!x.paid).sort((a,b)=>a.day-b.day);
    let target = null;
    const nm = t => t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(), w = nm(word);

  if(/^conquista/.test(low)){ botSay(p,p.achievements.length ? "Suas conquistas:\n"+p.achievements.map(a=>`${a.emoji} ${a.title}: ${Math.min(progress(p,a),a.target)} de ${a.target}`).join("\n") : "Ainda não há conquistas criadas para você."); save(); return; }
  const v = parseVal(low), words = low.split(/\s+/).length;
  if(!/^(comprei|gastei|paguei)/.test(low) && (v==null || words>5)){ save(); agentReply(p, text); return; }
  let item = low.replace(/r\$\s*/g," ").replace(/\d[\d.,]*/g," ").replace(/(^|\s)(comprei|gastei|paguei|um|uma|uns|umas|de|do|da|no|na|em|com|reais|real|por|pra|para)(?=\s|$)/g," ").replace(/\s+/g," ").trim();

  UI.pend = {item, value:v, step: v==null ? "valor" : "emocao"};

      break;
    }
    case "shareZap": UI.toast = "No sistema real, abre o WhatsApp com o convite e o link prontos para enviar."; render(); break;
    case "simJoin": UI.join = el.dataset.id; UI.joinStep = 1; UI.joinForm = {name:"",phone:"",age:"",ok:false}; render({top:true}); break;
    case "linkOff": case "linkOn": { const ev = S.events.find(e=>e.id===el.dataset.id); if(ev){ ev.link = a==="linkOn"; save(); render(); } break; }
    case "addPart": {
      const ev = S.events.find(e=>e.id===el.dataset.id), sel = document.getElementById("addPart"); if(!ev || !sel) break;
      const tk = todayKey(); ev.parts.push({pid:sel.value,joined:ev.kind==="desafio"?(ev.start>tk?ev.start:tk):tk,via:"add",rsvp:null});
      ev.posts.push({id:uid(),ts:new Date().toISOString(),by:"system",kind:"system",text:`${pById(sel.value).short} foi adicionado ao evento.`,likes:[],pinned:false});
      evNotify(ev, sel.value); UI.toast = `${pById(sel.value).short} foi adicionado e recebe o aviso no WhatsApp.`; save(); render(); break;
    }
    case "rmPart": { const ev = S.events.find(e=>e.id===el.dataset.id); if(ev){ ev.parts = ev.parts.filter(x=>x.pid!==el.dataset.pid); save(); render(); } break; }
    case "delEv": S.events = S.events.filter(e=>e.id!==el.dataset.id); UI.ev = null; UI.toast = "Evento apagado."; save(); render({top:true}); break;
    case "simEv": {
      const ev = S.events.find(e=>e.id===el.dataset.id), ana = S.patients[0]; if(!ev) break;
      const pt = ev.parts.find(x=>x.pid===ana.id);
      if(!pt){ UI.toast = `${ana.short} não está neste evento. No sistema real, cada participante recebe no próprio WhatsApp.`; render(); break; }
      ana.chat.forEach(m=>{m.quick=null;});
      if(ev.kind==="desafio"){
        const st = evStatus(ev), r = partProgress(ana,ev,pt), ok = dayOk(ana,ev,todayKey()), g = groupPct(ev);
        botSay(ana,`🎯 ${ev.name}
${st.t}. Regra: ${ruleText(ev)}.
${st.c==="live"?(ok?"Hoje você está dentro da regra ✅":"Hoje ficou fora da regra. Amanhã é um novo dia.")+"\n":""}Você cumpriu ${r.ok} de ${r.el.length} dias.${g!=null?` O grupo está com ${g}%.`:""}`);
      } else {
        botSay(ana,`⏰ Lembrete: ${ev.name}
${evWhen(ev)}
📍 ${ev.place}
Você vai?`,[["Vou"],["Talvez"],["Não vou"]]); UI.pendEv = ev.id;
      }
      UI.toast = `Mensagem enviada. Veja na aba WhatsApp da ${ana.short}.`; save(); render(); break;
    }
    case "rsvp": { const ev = S.events.find(e=>e.id===el.dataset.id), pt = ev && ev.parts.find(x=>x.pid===cur().id); if(pt){ pt.rsvp = v; save(); render(); } break; }
    case "joinNext": UI.joinStep = 2; render({top:true}); break;
    case "joinBack": UI.joinStep = 1; render({top:true}); break;
    case "joinHave": UI.toast = "No sistema real, quem já tem cadastro entra com um código enviado no WhatsApp."; render(); break;
    case "joinExit": UI.join = null; clearHash(); render({top:true}); break;
    case "joinSubmit": {
      const f = UI.joinForm, ev = S.events.find(e=>e.id===UI.join); if(!ev) break;
      const digits = (f.phone||"").replace(/\D/g,"");
      if((f.name||"").trim().length<2){ f.err = "Escreva seu nome."; render(); return; }
      if(digits.length<10){ f.err = "Escreva seu WhatsApp com DDD."; render(); return; }
      if(!f.ok){ f.err = "Para entrar, aceite receber as mensagens do Pausa."; render(); return; }
      f.err = null;
      const name = f.name.trim().split(/\s+/).map(cap).join(" "), first = name.split(" ")[0];
      const colors = ["#0E7490","#B45309","#BE185D","#4D7C0F","#6D28D9","#9F1239"];
      const np = {id:"p-"+uid(),name,short:first,age:parseInt(f.age)||null,color:colors[S.patients.length%colors.length],purchases:[],achievements:[],notify:defNotify(),alerts:[],
        chat:[{from:"bot",ts:new Date().toISOString(),text:`Oi, ${first}! Bem-vindo ao Pausa. 👋
Você entrou em ${ev.name}.
Para registrar uma compra, é só me mandar, tipo: comprei pão 12`}]};
      np.alerts.unshift({id:uid(),ts:new Date().toISOString(),icon:"🔗",text:`${first} entrou no evento ${ev.name} pelo link.`});
      S.patients.push(np); ev.parts.push({pid:np.id,joined:todayKey(),via:"link",rsvp:null});
      ev.posts.push({id:uid(),ts:new Date().toISOString(),by:"system",kind:"system",text:`${first} entrou no evento pelo link.`,likes:[],pinned:false});
      UI.joinStep = 3; save(); render({top:true}); break;
    }
    case "joinSee": UI.join = null; clearHash(); UI.role = "resp"; UI.tab = "eventos"; UI.ev = el.dataset.id; UI.evNew = false; UI.roomTab = "mural"; render({top:true}); break;
    case "openP": UI.pid = el.dataset.id; UI.tab = "resumo"; render({top:true}); break;
    case "big": S.big = !S.big; save(); render(); break;
    case "desk": UI.forceDesk = !UI.forceDesk; render({top:true}); break;
    case "bell": UI.bell = !UI.bell; render(); break;
    case "invite": UI.toast = "No sistema real, o convite vai por WhatsApp com um link de cadastro."; render(); break;
    case "filter": UI.filter = v; render(); break;
    case "novo": UI.role = "pessoa"; if(!UI.desk) UI.tab = UI.tab; UI.flow = {step:1, cat:null}; render({top:!UI.desk, focus:true}); break;
    case "exit": UI.flow = null; if(!UI.desk) UI.tab = "hoje"; render({top:!UI.desk}); break;
    case "backdrop": if(el===event.target){ UI.flow = null; render(); } break;
    case "back": UI.flow.step--; UI.flow.err = null; render({focus:true}); break;
    case "cat": UI.flow.cat = v; render(); break;
    case "next": {
      const f = UI.flow;
      if(f.step===1){ if(!(f.item||"").trim()){ f.err = "Escreva o que você comprou."; render({focus:true}); return; } if(!f.cat) f.cat = "Outro"; }
      if(f.step===1){ const n = parseVal(f.valueTxt||""); if(n==null || n<=0){ f.err = "Escreva o valor, por exemplo 49,90."; render({focus:true}); return; } f.value = n; }
      f.err = null; f.step++; render({top:!UI.desk, focus:true}); break;
    }
    case "emo": UI.flow.emotion = +v; UI.flow.step = 3; render({top:!UI.desk}); break;
    case "need": {
      const f = UI.flow;
      addPurchase(S.patients[0],{id:uid(),ts:new Date().toISOString(),item:cap(f.item.trim()),cat:f.cat,value:f.value,emotion:f.emotion,need:v,pro:null,via:"app"});
      f.step = 4; render({top:!UI.desk}); break;
    }
    case "send": { const d = document.getElementById("draft"); handleChat(d ? d.value : UI.draft); UI.draft = ""; render({chat:true, focus:true}); break; }
    case "quick": handleChat(v); render({chat:true}); break;
    case "simRem": p.chat.forEach(m=>{m.quick=null;}); botSay(p,todaySummary(p,`🔔 Lembrete das ${p.notify.dailyHour}\n`)); save(); render({chat:true}); break;
    case "simWeek": {
      p.chat.forEach(m=>{m.quick=null;});
      const P = weekList(p), s = weekScore(p), ins = insights(p)[0];
      botSay(p,`📊 Seu resumo da semana\n${P.length} compras, total de ${brl(P.reduce((x,y)=>x+y.value,0))}.\nNota média: ${s==null?"–":fmt1(s)+" "+EMO[emoOf(s)].f}\nNão necessárias: ${P.filter(x=>x.need==="nao").length}` + (ins?`\n\n${ins.t}`:""));
      save(); render({chat:true}); break;
    }
    case "pro": { const x = p.purchases.find(y=>y.id===el.dataset.id); if(x){ x.pro = x.pro===v ? null : v; save(); render(); } break; }
    case "fEmoji": UI.form.emoji = v; render(); break;
    case "fType": UI.form.type = v; render(); break;
    case "achCreate": {
      const f = UI.form, t = parseInt(f.target);
      if(!t || t<1){ f.err = "Coloque uma meta de pelo menos 1."; render(); return; }
      const ach = {id:uid(),emoji:f.emoji,title:(f.title||"").trim()||autoTitle(),type:f.type,target:t,reward:(f.reward||"").trim(),done:false};
      p.achievements.unshift(ach);
      if(progress(p,ach)>=ach.target) ach.done = true;
      else p.chat.push({from:"bot",ts:new Date().toISOString(),text:`🎯 Nova conquista de ${S.guardian} para você!\n${ach.emoji} ${ach.title}`+(ach.reward?`\nPrêmio: ${ach.reward}`:"")});
      UI.form = {emoji:"🌱",title:"",type:"sem_impulso",target:3,reward:""};
      UI.toast = `Conquista criada. ${p.short} recebe o aviso no WhatsApp.`;
      save(); render(); break;
    }
    case "achDel": p.achievements = p.achievements.filter(x=>x.id!==el.dataset.id); save(); render(); break;
    case "reset": try{ localStorage.removeItem(K); }catch(e){} S = seed(); migrate(); UI.flow = null; UI.pend = null; UI.pid = "ana"; UI.compose = false; UI.postOpen = null; UI.profile = null; UI.toast = "Demonstração recomeçada."; render({top:true}); break;
  }
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]");
  if(b){ act(b.dataset.a, b); return; }
  if(UI.bell && !e.target.closest(".bell-pop")){ UI.bell = false; render(); }
});
document.addEventListener("input", e => {
  const t = e.target, p = cur();
  if(t.dataset.f && UI.evForm){ UI.evForm[t.dataset.f] = t.value; return; }
  if(t.dataset.j){ UI.joinForm[t.dataset.j] = t.value; return; }
  if(t.id==="postDraft"){ UI.postDraft = t.value; return; }
  if(t.id==="cmtDraft"){ UI.cmtDraft = t.value; return; }
  if(t.dataset.df!==undefined && UI.debtForm){ UI.debtForm[t.dataset.df] = t.value; return; }
  if(t.dataset.mem){ p.memory[t.dataset.mem] = t.value; save(); return; }
  if(t.id==="memNote"){ UI.memDraft = t.value; return; }
  if(t.id==="memTry"){ UI.memTry = t.value; return; }
  if(t.dataset.gf && UI.goalForm){ UI.goalForm[t.dataset.gf] = t.value; refreshGoalCalc(); return; }
  if(t.id==="depVal"){ UI.depVal = t.value; return; }
  if(t.dataset.bf && UI.billForm){ UI.billForm[t.dataset.bf] = t.value; return; }
  if(t.dataset.c && UI.cform){ UI.cform[t.dataset.c] = t.value; refreshPreview(); return; }
  if(t.dataset.cs!==undefined && UI.cform){ UI.cform.slides[+t.dataset.cs] = t.value; refreshPreview(); return; }
  if(t.dataset.co!==undefined && UI.cform){ UI.cform.opts[+t.dataset.co] = t.value; refreshPreview(); return; }
  if(t.id==="f-item") UI.flow.item = t.value;
  else if(t.id==="f-val") UI.flow.valueTxt = t.value;
  else if(t.id==="draft") UI.draft = t.value;
  else if(t.id==="f-target"){ UI.form.target = t.value; const ti = document.getElementById("f-title"); if(ti) ti.placeholder = autoTitle(); }
  else if(t.id==="f-title") UI.form.title = t.value;
  else if(t.id==="f-reward") UI.form.reward = t.value;
  else if(t.dataset.n==="bigValue"){ p.notify.bigValue = parseInt(t.value)||1; save(); }
});
document.addEventListener("change", e => {
  const t = e.target, p = cur();
  if(t.dataset.f && UI.evForm){ UI.evForm[t.dataset.f] = t.value; return; }
  if(t.dataset.efpart){ const l = UI.evForm.parts; UI.evForm.parts = t.checked ? [...new Set([...l, t.dataset.efpart])] : l.filter(x=>x!==t.dataset.efpart); return; }
  if(t.dataset.efchk){ UI.evForm[t.dataset.efchk] = t.checked; return; }
  if(t.dataset.efrem){ UI.evForm.remind[t.dataset.efrem] = t.checked; return; }
  if(t.dataset.evrem){ const ev = S.events.find(x=>x.id===t.dataset.id); if(ev){ ev.remind[t.dataset.evrem] = t.checked; save(); } return; }
  if(t.hasAttribute("data-jok")){ UI.joinForm.ok = t.checked; return; }
  if(t.dataset.cchk && UI.cform){ UI.cform[t.dataset.cchk] = t.checked; return; }
  if(t.dataset.rt){ p.routine[t.dataset.rt] = t.value; save(); return; }
  if(t.dataset.rton){ p.routine.on[t.dataset.rton] = t.checked; save(); return; }
  if(t.hasAttribute("data-rtalert")){ p.routine.alertLow = t.checked; save(); return; }
  if(t.dataset.gf && UI.goalForm){ UI.goalForm[t.dataset.gf] = t.value; refreshGoalCalc(); return; }
  if(t.dataset.gfchk && UI.goalForm){ UI.goalForm[t.dataset.gfchk] = t.checked; return; }
  if(t.dataset.bfchk && UI.billForm){ UI.billForm[t.dataset.bfchk] = t.checked; if(t.dataset.bfchk==="variable") render(); return; }
  if(t.hasAttribute("data-pvdebts")){ p.privacy.debts = t.checked; save(); return; }
  if(t.id==="memAuthor"){ UI.memAuthor = t.value; return; }
  if(t.id==="memPriv"){ UI.memPriv = t.checked; return; }
  if(t.hasAttribute("data-invfile")){ const f = t.files && t.files[0]; startReading(f ? f.name : null); return; }
  if(t.hasAttribute("data-evrank")){ const ev = S.events.find(x=>x.id===t.dataset.id); if(ev){ ev.showRank = t.checked; save(); } return; }
  if(t.dataset.n==="pid"){ UI.pid = t.value; render(); }
  else if(t.dataset.n && t.type==="checkbox"){ p.notify[t.dataset.n] = t.checked; save(); }
  else if(t.dataset.n==="dailyHour"){ p.notify.dailyHour = t.value; save(); if(UI.desk) render(); }
});
document.addEventListener("keydown", e => {
  if(e.key==="Escape"){ if(UI.flow && UI.desk){ UI.flow = null; render(); } else if(UI.bell){ UI.bell = false; render(); } return; }
  if(e.key!=="Enter") return;
  const id = e.target.id;
  if(id==="draft"){ e.preventDefault(); act("send", e.target); }
  else if(id==="payVal"){ e.preventDefault(); const b = document.querySelector('[data-a="billPayConfirm"]'); if(b) act("billPayConfirm", b); }
  else if(id==="depVal"){ e.preventDefault(); const b = document.querySelector('[data-a="depSave"]'); if(b) act("depSave", b); }
  else if(id==="memTry"){ e.preventDefault(); const b = document.querySelector('[data-a="memTest"]'); if(b) act("memTest", b); }
  else if(id==="cmtDraft"){ e.preventDefault(); const b = document.querySelector('[data-a="comment"]'); if(b) act("comment", b); }
  else if(id==="f-item"){ e.preventDefault(); const nv = document.getElementById("f-val"); if(nv) nv.focus(); }
  else if(id==="f-val"){ e.preventDefault(); e.target.blur(); }
  else if(e.target.matches && e.target.matches("tr[data-a]")){ act(e.target.dataset.a, e.target); }
});
document.addEventListener("dblclick", e => {
  const m = e.target.closest("[data-dbl]"); if(!m || m.dataset.dbl==="preview") return;
  const po = S.feed.find(x=>x.id===m.dataset.dbl); if(po && !po.likedBy.includes(viewerId())){ po.likedBy.push(viewerId()); save(); render(); }
});
let touchX = null;
document.addEventListener("touchstart", e => { if(e.target.closest("[data-car]")) touchX = e.touches[0].clientX; }, {passive:true});
document.addEventListener("touchend", e => {
  const c = e.target.closest("[data-car]"); if(!c || touchX==null) return;
  const dx = e.changedTouches[0].clientX - touchX; touchX = null;
  if(Math.abs(dx) > 40){ const id = c.dataset.car, po = id==="preview" ? previewPost() : S.feed.find(x=>x.id===id); if(!po) return;
    UI.slides[id] = Math.max(0, Math.min((UI.slides[id]||0)+(dx<0?1:-1), po.slides.length-1)); if(id==="preview") refreshPreview(); else render(); }
}, {passive:true});
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(()=>render(), 150); });
migrate();
S.patients.forEach(checkUnlocks); UI.toast = null; checkHash();
getSample().then(sm=>{ UI.ai = !!sm; render(); });
window.addEventListener("hashchange", () => { if(checkHash()) render({top:true}); });
render();
</script>
</body>
</html>
